; Shared base for all V3 environments (standard + evil)
[heltec_v3_base]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_check = true
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3

[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_partition_scheme = 8MB

extends = heltec_v3_base
board_level = pr
build_flags =
  ${heltec_v3_base.build_flags}

; Full evil: all features compiled in, all OFF by default at runtime.
; Operator enables features live via evil_ctrl.py or mobile app.
[env:heltec-v3-evil-full]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V3 Evil Full

extends = heltec_v3_base
; Pin to CP2102 port
upload_port = /dev/cu.SLAB_USBtoUART
build_flags =
  ${heltec_v3_base.build_flags}
  ; Evil node master enable
  -D EVIL_NODE=1
  ; Source spoofing (required for flood and forge tools)
  -D EVIL_ALLOW_FROM_OVERRIDE=1
  ; All evil features compiled in — controlled at runtime via EvilCtrlModule
  ; Default runtime state: transform=off, drop=0, hop=normal, flood=off
  -D EVIL_TRANSFORM=1
  -D EVIL_NODEINFO_FLOOD=1
  -D EVIL_FLOOD_COUNT=200
  -D EVIL_SYNCWORD_JAM=1
