[heltec_v4_base] 
extends = esp32s3_base
board = heltec_v4
board_check = true
board_build.partitions = default_16MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V4
  -I variants/esp32s3/heltec_v4
lib_deps = 
  ${esp32s3_base.lib_deps}


[env:heltec-v4]
extends = heltec_v4_base
build_flags = 
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306 ; Heltec_v4 has an SSD1315 display (compatible with SSD1306 driver)
  -D LED_PIN=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3
lib_deps = 
  ${heltec_v4_base.lib_deps}

; ── Evil node environments ────────────────────────────────────────────────────
; Base evil config: source spoofing + MitM ROT-13 transform
[env:heltec-v4-evil]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 Evil (8MB)
custom_meshtastic_partition_scheme = 8MB

extends = heltec_v4_base
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306
  -D LED_POWER=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3
  ; Evil node master enable
  -D EVIL_NODE=1
  ; Source node ID spoofing: allow Python API to set arbitrary from node ID
  -D EVIL_ALLOW_FROM_OVERRIDE=1
  ; MitM: ROT-13 all text messages in transit
  -D EVIL_TRANSFORM=1
  -D EVIL_TRANSFORM_ROT13=1

; Drop mode: silently drop 30% of relayed packets (mesh disruption)
[env:heltec-v4-evil-drop]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 Evil Drop (8MB)
custom_meshtastic_partition_scheme = 8MB

extends = heltec_v4_base
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306
  -D LED_POWER=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3
  -D EVIL_NODE=1
  -D EVIL_ALLOW_FROM_OVERRIDE=1
  ; Drop 30% of relay packets randomly (black hole)
  -D EVIL_DROP_RATE=30

; Flood mode: NodeDB exhaustion attack
[env:heltec-v4-evil-flood]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 Evil Flood (8MB)
custom_meshtastic_partition_scheme = 8MB

extends = heltec_v4_base
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306
  -D LED_POWER=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3
  -D EVIL_NODE=1
  -D EVIL_ALLOW_FROM_OVERRIDE=1
  ; NodeInfo flood: inject 200 fake nodes with fake public keys (resists eviction)
  -D EVIL_NODEINFO_FLOOD=1
  -D EVIL_FLOOD_COUNT=200
  -D EVIL_FLOOD_WITH_KEY=1

; Full evil: all features compiled in, all OFF by default at runtime.
; Operator enables features live via evil_ctrl.py or mobile app (Phase 4.2/4.3).
; Replaces the need to flash between separate evil envs during a demo.
[env:heltec-v4-evil-full]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 Evil Full (8MB)
custom_meshtastic_partition_scheme = 8MB

extends = heltec_v4_base
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; Pin to CP2102 port — prevents accidental flash to T-Deck or other USB devices
upload_port = /dev/cu.SLAB_USBtoUART
build_flags =
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306
  -D LED_POWER=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3
  -UARDUINO_USB_CDC_ON_BOOT
  -D ARDUINO_USB_CDC_ON_BOOT=0
  ; Evil node master enable
  -D EVIL_NODE=1
  ; Source spoofing (required for flood and forge tools)
  -D EVIL_ALLOW_FROM_OVERRIDE=1
  ; All evil features compiled in — controlled at runtime via EvilCtrlModule
  ; Default runtime state: transform=off, drop=0, hop=normal, flood=off
  -D EVIL_TRANSFORM=1
  -D EVIL_NODEINFO_FLOOD=1
  -D EVIL_FLOOD_COUNT=200

; Hop maximizer: force hop_limit=7 on all relayed packets (range amplifier)
[env:heltec-v4-evil-hop]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 Evil Hop (8MB)
custom_meshtastic_partition_scheme = 8MB

extends = heltec_v4_base
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306
  -D LED_POWER=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3
  -D EVIL_NODE=1
  ; Force hop_limit=7 on all relayed packets (amplify range beyond sender's intent)
  -D EVIL_HOP_MAX=1

; ── TFT base (shared by vanilla + evil TFT envs) ──────────────────────────────
[heltec_v4_tft_base]
extends = heltec_v4_base
build_flags =
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_TFT
  -D I2C_SDA=4
  -D I2C_SCL=3
  -D I2C_SDA1=47
  -D I2C_SCL1=48
  -D PIN_BUTTON2=35
  -D PIN_BUZZER=6
  -D USE_PIN_BUZZER=PIN_BUZZER
  -D CONFIG_ARDUHAL_LOG_COLORS
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_VERBOSE_ASSERT=0
  -D RADIOLIB_SPI_PARANOID=0
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D RAM_SIZE=1560
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D LGFX_DRIVER=LGFX_HELTEC_V4_TFT
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_HELTEC_V4_TFT.h\"
  -D VIEW_320x240
  -D DISPLAY_SIZE=320x240
  -D LGFX_PIN_SCK=17
  -D LGFX_PIN_MOSI=33
  -D LGFX_PIN_DC=16
  -D LGFX_PIN_CS=15
  -D LGFX_PIN_BL=21
  -D LGFX_PIN_RST=18
  -D CUSTOM_TOUCH_DRIVER
  -D TOUCH_SDA_PIN=I2C_SDA1
  -D TOUCH_SCL_PIN=I2C_SCL1
  -D TOUCH_INT_PIN=-1
  -D TOUCH_RST_PIN=44
  -D TFT_CS=LGFX_PIN_CS
  -D ST7789_CS=TFT_CS
  -D ST7789_RS=LGFX_PIN_DC
  -D ST7789_SDA=LGFX_PIN_MOSI
  -D ST7789_SCK=LGFX_PIN_SCK
  -D ST7789_RESET=LGFX_PIN_RST
  -D ST7789_MISO=-1
  -D ST7789_BUSY=-1
  -D ST7789_BL=LGFX_PIN_BL
  -D ST7789_SPI_HOST=SPI3_HOST
  -D TFT_BL=ST7789_BL
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=4000000
  -D TFT_HEIGHT=240
  -D TFT_WIDTH=320
  -D TFT_OFFSET_X=0
  -D TFT_OFFSET_Y=0
  -D TFT_OFFSET_ROTATION=0
  -D SCREEN_ROTATE
  -D SCREEN_TRANSITION_FRAMERATE=5
  -D BRIGHTNESS_DEFAULT=130
  -D HAS_TOUCHSCREEN=1
  -D TOUCH_I2C_PORT=0
  -D TOUCH_SLAVE_ADDRESS=0x2E
  -D SCREEN_TOUCH_INT=TOUCH_INT_PIN
  -D SCREEN_TOUCH_RST=TOUCH_RST_PIN
lib_deps = ${heltec_v4_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.0
  https://github.com/Quency-D/chsc6x/archive/5cbead829d6b432a8d621ed1aafd4eb474fd4f27.zip

[env:heltec-v4-tft]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 TFT
custom_meshtastic_partition_scheme = 16MB
extends = heltec_v4_tft_base
build_flags = ${heltec_v4_tft_base.build_flags}

; Full evil for TFT expansion housing (16MB, ST7789 touch display)
[env:heltec-v4-tft-evil-full]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Heltec V4 TFT Evil Full (16MB)
custom_meshtastic_partition_scheme = 16MB
extends = heltec_v4_tft_base
build_flags =
  ${heltec_v4_tft_base.build_flags}
  -D EVIL_NODE=1
  -D EVIL_ALLOW_FROM_OVERRIDE=1
  -D EVIL_TRANSFORM=1
  -D EVIL_NODEINFO_FLOOD=1
  -D EVIL_FLOOD_COUNT=200
